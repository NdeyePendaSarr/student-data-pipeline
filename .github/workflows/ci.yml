# CI Student Data Pipeline
# Backend : Ruff, tests unitaires (sans base) et tests d'intégration
#           contre un service PostgreSQL 16.
# Frontend : vérifie que l'interface React se compile.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — Ruff, Pytest et intégration PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      INTEGRATION: "1"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: test
      DB_USER: test
      DB_PASSWORD: test

    steps:
      - uses: actions/checkout@v4

      # 3.12 : les versions épinglées (pydantic 2.7.0, psycopg2-binary 2.9.9)
      # n'ont pas de paquets précompilés pour Python 3.13.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Lancer les tests (unitaires et intégration)
        run: python -m pytest -v

  frontend:
    name: Frontend — build Vite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4

      # Vite 8 exige Node 20.19 ou plus : "20" prend la dernière 20.x.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler l'interface
        run: npm run build
